# Render Blueprint: the deploy configuration as code. In the Render dashboard,
# New > Blueprint > pick this repo, and Render creates the service described here.
# The database lives on Neon, so it isn't declared here.
services:
  - type: web
    name: movie-reservation-api
    # Build the Dockerfile in this repo; its CMD runs the migrations, then the server.
    runtime: docker
    plan: free
    region: oregon
    # Render polls this; a deploy only goes live once the new container answers 200,
    # so a version that crashes on startup never replaces the working one.
    healthCheckPath: /health
    # Deploy a new commit on main only after its GitHub checks (our CI) pass.
    autoDeployTrigger: checksPass
    envVars:
      # Neon's connection string. sync: false means "ask for it in the dashboard",
      # so the secret never lives in git.
      - key: DATABASE_URL
        sync: false
      # Render generates a random value once and keeps it.
      - key: JWT_SECRET
        generateValue: true
      # Measured on the live service: requests arrive through THREE proxies (Cloudflare's
      # edge, Render's load balancer, and a proxy on the same machine), so the client's IP
      # is the third address from the right (see TRUST_PROXY_HOPS in src/config/env.ts).
      # To check after a change: the pk= value in the RateLimit-Policy header (a hash of the
      # client key) must stay the same across requests, and must not change when you send
      # a fake X-Forwarded-For header.
      - key: TRUST_PROXY_HOPS
        value: "3"
      - key: THEATER_TIMEZONE
        value: UTC
