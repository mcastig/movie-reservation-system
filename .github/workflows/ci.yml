# Continuous integration: GitHub runs this on a fresh Linux machine for every push
# to main and every pull request. A red X on a commit means one of these steps failed.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the run that's still going for an older one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A real Postgres next to the job, like `npm run db:up` locally. The integration
    # tests create the movies_test database in it and run the migrations.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: movies
          POSTGRES_PASSWORD: movies
          POSTGRES_DB: movies
        ports:
          - 5432:5432
        # Don't start the steps until Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U movies -d movies"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # Reuses downloaded packages between runs, keyed on package-lock.json.
          cache: npm

      # Exactly the versions in package-lock.json; fails if it's out of sync with package.json.
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # tests/test-env.ts points the tests at localhost:5432/movies_test, which is this service.
      - run: npm test

  docker:
    name: Build the Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      # Catches a broken Dockerfile before the deploy platform tries to build it.
      - run: docker build -t movies-api .
